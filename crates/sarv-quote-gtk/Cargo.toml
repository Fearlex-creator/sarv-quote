[package]
name = "sarv-quote-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Legacy GTK4/libadwaita UI (temporary until Tauri cutover)"

[[bin]]
name = "sarv-quote-gtk"
path = "src/main.rs"

[dependencies]
sarv-quote = { path = "../sarv-quote" }
anyhow.workspace = true
chrono.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
relm4 = { version = "0.11", features = ["libadwaita", "macros"] }
