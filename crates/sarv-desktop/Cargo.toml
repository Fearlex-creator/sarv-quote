[package]
name = "sarv-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rune desktop interface for Sarv accounting"
build = "build.rs"

[dependencies]
chrono.workspace = true
getrandom = "0.3"
rune = { git = "https://github.com/anomalyco/rune", rev = "b556a38a1ff88aa8690d21b45ebf9b9167038674" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b556a38a1ff88aa8690d21b45ebf9b9167038674" }
sarv-quote = { path = "../sarv-quote", features = ["pdf-export"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sarv-quote = { path = "../sarv-quote", features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "sarv-desktop"
path = "src/main.rs"
