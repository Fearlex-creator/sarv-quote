[package]
name = "sarv-quote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline Persian accounting and quotation engine"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
csv.workspace = true
cairo-rs = { workspace = true, optional = true }
pangocairo = { workspace = true, optional = true }
rusqlite.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
# pango used by export modules for RTL PDF text
pango = { version = "0.22", optional = true }
argon2 = { version = "0.5", features = ["std"] }
# Read-only workbook parser. It does not calculate formulas or run macros.
calamine = "0.38"
rust_xlsxwriter = "0.102"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[features]
default = []
pdf-export = ["dep:cairo-rs", "dep:pangocairo", "dep:pango"]

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "sarv-agent"
path = "src/bin/sarv-agent.rs"
