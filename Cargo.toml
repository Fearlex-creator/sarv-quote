[workspace]
resolver = "2"
members = ["crates/sarv-quote"]
exclude = ["desktop/src-tauri"]
default-members = ["crates/sarv-quote"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
pangocairo = "0.22"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
