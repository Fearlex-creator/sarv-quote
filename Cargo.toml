[package]
name = "sarv-quote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline Persian native accounting and quotation application"
default-run = "sarv-quote"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"], optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
cairo-rs = { version = "0.22", features = ["pdf", "png"], optional = true }
pangocairo = { version = "0.22", optional = true }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["native-gtk"]
native-gtk = ["dep:adw", "dep:gtk", "dep:cairo-rs", "dep:pangocairo"]

[[bin]]
name = "sarv-quote"
path = "src/main.rs"
required-features = ["native-gtk"]

[[bin]]
name = "sarv-agent"
path = "src/bin/sarv-agent.rs"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
