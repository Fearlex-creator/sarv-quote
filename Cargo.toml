[workspace]
resolver = "2"
members = [
    "crates/sarv-quote",
    "crates/sarv-desktop",
]
default-members = ["crates/sarv-quote", "crates/sarv-desktop"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
pangocairo = "0.22"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "debuginfo"
lto = "thin"
