[package]
name = "sarv-desktop"
version = "0.1.0"
edition = "2024"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
sarv-quote = { path = "../../crates/sarv-quote", default-features = false, features = ["pdf-export"] }

# Shipping build: `cargo build --release`.
# Day-to-day build: `cargo build --profile fast` (incremental, many codegen units).
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 1
debug = 0
