[package]
name = "sarv-quote-tauri"
version = "0.1.0"
description = "سرو — Tauri desktop shell"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "sarv_quote_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
sarv-quote = { path = "../crates/sarv-quote" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
