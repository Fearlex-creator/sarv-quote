name: Windows build

# Builds the portable Windows folder, a per-user setup executable, and the
# Linux deb. Uploads them as workflow artifacts.
# A push of this branch, and a pull request into main, both run the build.
# It does not create a tag, publish a release, or use pull_request_target.
# release-windows.yml remains the workflow that publishes on a v* tag.
on:
  push:
    branches:
      - cursor/retail-excel-pos-8dc2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz

      - name: Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
          key: windows-gnu-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Build agent and desktop app
        run: |
          pnpm --dir desktop run build:agent
          pnpm --dir desktop exec tauri build --no-bundle

      - name: Collect portable folder
        run: |
          set -euo pipefail
          out="Sarv-windows-x64"
          mkdir -p "$out"
          cp desktop/src-tauri/target/release/sarv-desktop.exe "$out/Sarv.exe"
          cp target/release/sarv-agent.exe "$out/"
          find desktop/src-tauri/target/release -name WebView2Loader.dll -path '*x64*' | head -n1 | xargs -I{} cp {} "$out/"
          ldd "$out/Sarv.exe" "$out/sarv-agent.exe" \
            | awk '/\/mingw64\// {print $3}' | sort -u \
            | xargs -I{} cp {} "$out/"
          cp LICENSE "$out/"
          ls -l "$out"
          zip -r "$out.zip" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: Sarv-windows-x64
          path: Sarv-windows-x64.zip
          if-no-files-found: error

      - name: Windows setup executable
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "choco failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS was not installed" }
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = "desktop/src-tauri/installer"
          New-Item -ItemType Directory -Force -Path "$stage/payload" | Out-Null
          Copy-Item Sarv-windows-x64\* "$stage/payload" -Force
          Copy-Item desktop/src-tauri/icons/icon.ico "$stage/payload/icon.ico" -Force
          Copy-Item desktop/src-tauri/icons/icon.ico "$stage/icon.ico" -Force
          Copy-Item LICENSE "$stage/LICENSE.txt" -Force
          Push-Location $stage
          & $makensis "/DPRODUCT_VERSION=$version" "/INPUTCHARSET" "UTF8" "sarv.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          Get-ChildItem "Sarv-*-windows-x64-setup.exe" | Format-List Name, Length
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: Sarv-windows-setup
          path: desktop/src-tauri/installer/Sarv-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Build the Debian package
        run: pnpm --dir desktop exec tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: Sarv-linux-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
