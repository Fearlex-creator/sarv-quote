name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev poppler-utils pkg-config libxkbcommon-dev libwayland-dev libx11-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Engine tests
        run: cargo test -p sarv-quote

      - name: Engine PDF export tests
        run: cargo test -p sarv-quote --features pdf-export

      - name: Desktop headless tests
        run: cargo test -p sarv-desktop --bin sarv-desktop
