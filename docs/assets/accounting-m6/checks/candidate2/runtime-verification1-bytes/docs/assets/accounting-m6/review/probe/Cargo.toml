[package]
name = "sarv-independent-m6-probe"
version = "0.0.0"
edition = "2024"
[dependencies]
sarv-quote = { path = "../../../../.." }
anyhow = "1"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
[profile.dev]
debug = 0
[[bin]]
name = "sarv-independent-m6-probe"
path = "src/main.rs"
[[bin]]
name = "sarv-independent-m6-store-faults"
path = "src/store_faults.rs"
[[bin]]
name = "sarv-independent-m6-migration"
path = "src/migration.rs"
[[bin]]
name = "sarv-independent-m6-guards"
path = "src/guards.rs"
