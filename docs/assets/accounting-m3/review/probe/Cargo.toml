[package]
name="sarv-independent-m3-probe"
version="0.0.0"
edition="2024"
[dependencies]
sarv-quote={path="../../.."}
anyhow="1"
serde_json="1"
csv="1"
rusqlite={version="0.38",features=["bundled"]}
[profile.dev]
debug=0
[[bin]]
name="sarv-independent-m3-atomic"
path="src/atomic.rs"
[[bin]]
name="sarv-independent-m3-probe"
path="src/main.rs"
[[bin]]
name="sarv-independent-m3-migration"
path="src/migration.rs"

[[bin]]
name="sarv-independent-m3-reports"
path="src/reports.rs"
