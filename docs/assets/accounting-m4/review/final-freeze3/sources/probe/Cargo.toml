[package]
name="sarv-independent-m4-probe"
version="0.0.0"
edition="2024"
[dependencies]
sarv-quote={path="../../.."}
anyhow="1"
serde_json="1"
rusqlite={version="0.38",features=["bundled"]}
[profile.dev]
debug=0
[[bin]]
name="sarv-independent-m4-probe"
path="src/main.rs"
[[bin]]
name="sarv-independent-m4-atomic"
path="src/atomic.rs"
[[bin]]
name="sarv-independent-m4-migration"
path="src/migration.rs"
[[bin]]
name="sarv-independent-m4-integration"
path="src/integration.rs"
[[bin]]
name="sarv-independent-m4-export"
path="src/export.rs"
[[bin]]
name="sarv-independent-m4-dates"
path="src/dates.rs"
[[bin]]
name="sarv-independent-m4-manual-revision"
path="src/manual_revision.rs"
[[bin]]
name="sarv-independent-m4-backup"
path="src/backup.rs"
[[bin]]
name="sarv-independent-m4-legacy-event"
path="src/legacy_event.rs"
